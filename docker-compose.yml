services:
  postgres:
    image: postgres:17-alpine
    container_name: weight-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: weight_tracker
    ports:
      - "5435:5432"
    volumes:
      - weight-tracker-pgdata:/var/lib/postgresql/data
      - ./scripts/create-test-database.sh:/docker-entrypoint-initdb.d/create-test-database.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d weight_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  weight-tracker-pgdata:
