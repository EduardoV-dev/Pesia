<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Weight Tracker — Álbum de familia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;500&family=Familjen+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--page:#1c1e20;--paper:#26292b;--ink:#eceae5;--soft:#9ba09f;--teal:#7fa8a2;--silver:#b9bcc0}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#101213}
  body{font-family:'Familjen Grotesk',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
  .phone{width:390px;height:844px;overflow:hidden;background:var(--page);display:flex;flex-direction:column}
  .bar{display:flex;justify-content:space-between;align-items:center;padding:15px 20px 11px}
  .brand{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft)}
  .brand b{color:var(--ink);font-weight:600}
  .folio{font-family:'Azeret Mono',monospace;font-size:9.5px;letter-spacing:.12em;color:var(--silver)}
  .mount{flex:1;margin:0 16px;background:var(--paper);border-radius:3px;padding:18px 18px 0;position:relative;display:flex;flex-direction:column;gap:13px;box-shadow:0 14px 34px rgba(0,0,0,.42)}
  .corner{position:absolute;width:17px;height:17px;border-top:2px solid var(--silver);border-left:2px solid var(--silver);opacity:.72}
  .c1{top:-1px;left:-1px;border-right:0;border-bottom:0}
  .c2{top:-1px;right:-1px;border-left:0;border-bottom:0}
  .c3{bottom:-1px;left:-1px;border-right:0;border-top:0}
  .c4{bottom:-1px;right:-1px;border-left:0;border-top:0}
  .plate{position:relative;flex:1;min-height:150px;background:#1a1c1d;border:1px solid rgba(185,188,192,.18);display:flex;align-items:center;justify-content:center;overflow:hidden}
  .plate::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 18%,rgba(127,168,162,.20),transparent 62%)}
  .avatar{position:relative;font-size:46px;line-height:1;filter:saturate(.85)}
  .who{display:flex;justify-content:space-between;align-items:flex-end;padding-bottom:12px;border-bottom:1px solid rgba(185,188,192,.22)}
  .who h1{font-size:25px;font-weight:600;letter-spacing:-.015em}
  .who .unit{font-family:'Azeret Mono',monospace;font-size:12px;color:var(--soft);padding-bottom:4px}
  .caption{font-size:11.5px;color:var(--soft);padding-bottom:12px;border-bottom:1px solid rgba(185,188,192,.22)}
  .caption b{color:var(--teal);font-weight:600}
  .figure{font-family:'Azeret Mono',monospace;font-size:46px;font-weight:500;letter-spacing:-.03em;padding:2px 0 4px}
  .figure small{font-size:13px;color:var(--soft);margin-left:7px;letter-spacing:0}
  .strip{display:flex;gap:5px;overflow:hidden}
  .strip div{flex:1;border:1px solid rgba(185,188,192,.22);padding:6px 6px 7px}
  .strip .d{font-family:'Azeret Mono',monospace;font-size:8.5px;color:var(--soft);letter-spacing:.04em}
  .strip .v{font-family:'Azeret Mono',monospace;font-size:12.5px;margin-top:3px}
  .strip .v.gap{border-style:dashed;color:var(--soft)}
  .sign{margin-top:auto;font-size:11px;color:var(--soft);border-top:1px solid rgba(185,188,192,.22);padding-top:11px}
  .sign b{color:var(--ink);font-weight:600}
  .foot{padding:14px 20px 18px;display:flex;flex-direction:column;gap:10px}
  .primary{background:var(--ink);color:#151718;font-family:'Familjen Grotesk';font-size:15px;font-weight:600;padding:13px;border:0;border-radius:999px;cursor:pointer;width:100%}
  .next{display:flex;justify-content:space-between;font-size:11.5px;color:var(--soft)}
  .next b{color:var(--ink);font-weight:600}
</style>
</head>
<body>
<div class="phone">
  <div class="bar">
    <span class="brand"><b>Weight Tracker</b></span>
    <span class="folio">Lámina 3 de 6</span>
  </div>
  <div class="mount">
    <i class="corner c1"></i><i class="corner c2"></i><i class="corner c3"></i><i class="corner c4"></i>
    <div class="plate"><span class="avatar"><svg width="62" height="62" viewBox="0 0 62 62" fill="none" aria-hidden="true"><circle cx="31" cy="23" r="12" fill="#7fa8a2" opacity=".9"/><path d="M7 60c0-13.2 10.7-21 24-21s24 7.8 24 21" fill="#7fa8a2" opacity=".5"/></svg></span></div>
    <div class="who">
      <h1>Luis Herrera</h1>
      <span class="unit">kg</span>
    </div>
    <p class="caption">Casa Herrera · domingo 8 nov · <b>moviendo hacia tu objetivo</b></p>
    <div class="figure">72,4<small>kg</small></div>
    <div class="strip">
      <div><div class="d">1 nov</div><div class="v">72,8</div></div>
      <div><div class="d">8 nov</div><div class="v">72,4</div></div>
      <div><div class="d">15 nov</div><div class="v gap">sin datos</div></div>
      <div><div class="d">22 nov</div><div class="v">71,6</div></div>
    </div>
    <div class="sign">Registrado por <b>Ana</b> · domingo 8 nov, 18:40 · media de 7 días <b>72,1</b></div>
  </div>
  <div class="foot">
    <button class="primary">Guardar peso</button>
    <div class="next"><span>Siguiente: <b>Nina</b></span><span>Registrado por Ana · 18:40</span></div>
  </div>
</div>
</body>
</html>
